<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login</title>
  <style>body{font-family:Arial,Helvetica,sans-serif;max-width:720px;margin:40px auto;padding:0 16px}form{display:grid;gap:8px}input,button{padding:8px;font-size:16px}</style>
</head>
<body>
  <h1>Login</h1>
  <form id="loginForm">
    <label>Email<input type="email" name="email" required></label>
    <label>Password<input type="password" name="password" required></label>
    <button type="submit">Login</button>
  </form>
  <p id="msg"></p>
  <p>No account? <a href="/Basic-Website/campus-hub/frontend/register.html">Register</a></p>

  <script>
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      const fd = new FormData(form);
      const payload = Object.fromEntries(fd.entries());
      try {
        const res = await fetch('/Basic-Website/campus-hub/backend/auth/login.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          credentials: 'include'
        });
        const data = await res.json();
        if (res.ok) {
          msg.style.color = 'green';
          msg.textContent = data.message || 'Login successful';
          setTimeout(() => window.location.href = '/Basic-Website/campus-hub/frontend/dashboard.html', 300);
        } else {
          msg.style.color = 'crimson';
          msg.textContent = data.message || 'Login failed';
        }
      } catch (err) {
        msg.style.color = 'crimson';
        msg.textContent = 'Network error';
      }
    });
  </script>
</body>
</html>
