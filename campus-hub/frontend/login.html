<!doctype html>
<html lang="en">
<link rel="stylesheet" href="style.css">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login</title>
  <style>body{font-family:Arial,Helvetica,sans-serif;max-width:720px;margin:40px auto;padding:0 16px}form{display:grid;gap:8px}input,button{padding:8px;font-size:16px}</style>
</head>
<body>
  <h1>Login</h1>
  <form id="loginForm">
    <label>Email <input type="email" name="email" required></label>
    <label>Password <input type="password" name="password" required></label>
    <button class="btn-primary" type="submit">Login</button>
  </form>
  <p id="msg"></p>
  <p>No account? <a href="/Basic-Website/campus-hub/frontend/register.html">Register</a></p>

  <script>
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');
    
    // Input validation
    function validateEmail(email) {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return emailRegex.test(email.trim());
    }
    
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      msg.style.color = '';
      
      try {
        const fd = new FormData(form);
        const email = fd.get('email').trim();
        const password = fd.get('password');
        
        // Validate input
        if (!email) {
          msg.style.color = 'crimson';
          msg.textContent = 'Email is required';
          return;
        }
        
        if (!validateEmail(email)) {
          msg.style.color = 'crimson';
          msg.textContent = 'Please enter a valid email address';
          return;
        }
        
        if (!password) {
          msg.style.color = 'crimson';
          msg.textContent = 'Password is required';
          return;
        }
        
        if (password.length < 6) {
          msg.style.color = 'crimson';
          msg.textContent = 'Invalid email or password';
          return;
        }
        
        const payload = { email, password };
        
        const res = await fetch('/Basic-Website/campus-hub/backend/auth/login.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          credentials: 'include'
        });
        
        const data = await res.json();
        
        if (res.ok) {
          msg.style.color = 'green';
          msg.textContent = 'Login successful! Redirecting...';
          setTimeout(() => window.location.href = '/Basic-Website/campus-hub/frontend/dashboard.html', 500);
        } else if (res.status === 400) {
          msg.style.color = 'crimson';
          msg.textContent = data.message || 'Invalid email or password';
        } else if (res.status === 401) {
          msg.style.color = 'crimson';
          msg.textContent = 'Invalid email or password';
        } else {
          msg.style.color = 'crimson';
          msg.textContent = 'An error occurred. Please try again.';
        }
      } catch (err) {
        console.error('Login error:', err);
        msg.style.color = 'crimson';
        msg.textContent = 'Network error. Please check your connection.';
      }
    });
  </script>
</body>
</html>
